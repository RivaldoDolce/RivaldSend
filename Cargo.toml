[workspace]
resolver = "2"
members = ["crates/rivaldsend-proto", "crates/rivaldsend-core", "crates/rivaldsend-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["RivaldSend contributors"]
repository = "https://github.com/rivaldsend/rivaldsend"
rust-version = "1.85.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1.7"
blake3 = "1.6"
uuid = { version = "1.10", features = ["v4", "serde"] }
rustls = "0.23"
axum = { version = "0.7", features = ["http1"] }
hyper = "1.4"
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
